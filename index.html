<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <title>Labyrint med tyngdekraft</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-container">
      <canvas id="game" width="720" height="720"></canvas>
      <div class="hud">
        <h1>Labyrint med tyngdekraft</h1>
        <p class="instructions">
          Brug <span>◀</span> og <span>▶</span> til at dreje banen. Få bolden til udgangen uden at falde i huller.
        </p>
        <div class="status">
          <div>Niveau: <span id="level">1</span>/<span id="total-levels"></span></div>
          <div>Tid: <span id="timer">0.00s</span></div>
          <div>Bedste tid: <span id="best-time">–</span></div>
        </div>
      </div>
    </div>
    <div id="message" class="message hidden"></div>
    <script src="game.js"></script>
  </body>
</html>
